services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://backend:2750
    container_name: intellico_frontend
    restart: unless-stopped
    ports:
      - "2600:3000"            # Next.js default port
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:2750
    networks:
      - intellico_net

  backend:
    build:
      context: ./backend
    container_name: intellico_backend
    restart: unless-stopped
    ports:
      - "2750:5000"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI}
      - FLOWCHART_API_URL=${FLOWCHART_API_URL}
      - STORAGE_PATH=/app/storage
    volumes:
      - ./backend/storage:/app/storage
    networks:
      - intellico_net

  mongo:
    image: mongo:6.0
    container_name: intellico_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    networks:
      - intellico_net

networks:
  intellico_net:
    driver: bridge
